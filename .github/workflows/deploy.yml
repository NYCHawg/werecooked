name: Deploy web app and build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: pages
        uses: actions/deploy-pages@v4
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bundle the web app into the APK
        run: cp -r web/. android/app/src/main/assets/
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/*.apk WereCooked.apk
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" WereCooked.apk --title "We're Cooked build ${{ github.run_number }}" --notes "Tap WereCooked.apk to download, then open it on your Android phone to install." --latest
      - name: Keep a copy on the apk branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir /tmp/out && cp WereCooked.apk /tmp/out/
          git checkout --orphan apk
          git rm -rf . -q
          cp /tmp/out/WereCooked.apk .
          git add WereCooked.apk
          git commit -q -m "APK from build ${{ github.run_number }}"
          git push -f origin apk
