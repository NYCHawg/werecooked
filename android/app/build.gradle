plugins { id 'com.android.application' }

android {
    namespace 'com.summithouse.werecooked'
    compileSdk 34
    defaultConfig {
        applicationId 'com.summithouse.werecooked'
        minSdk 26
        targetSdk 34
        versionCode 19
        versionName '2.16'
    }
    buildFeatures { buildConfig true; resValues true }
    flavorDimensions 'app'
    productFlavors {
        cooked {
            dimension 'app'
            applicationId 'com.summithouse.werecooked'
            buildConfigField 'String', 'HOME', '"https://appassets.androidplatform.net/assets/index.html"'
            resValue 'string', 'app_name', 'We’re Cooked'
            buildConfigField 'String', 'BAR_COLOR', '"#1F4D38"'
            manifestPlaceholders = [authScheme: 'werecooked']
        }
        bar {
            dimension 'app'
            applicationId 'com.summithouse.backhomebar'
            versionCode 3
            versionName '1.2'
            buildConfigField 'String', 'HOME', '"https://appassets.androidplatform.net/assets/bar/index.html"'
            resValue 'string', 'app_name', 'Back Home Bar'
            buildConfigField 'String', 'BAR_COLOR', '"#121318"'
            manifestPlaceholders = [authScheme: 'backhomebar']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly. Swap in your own keystore before publishing to Play.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.12.0'
}
