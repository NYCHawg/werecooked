plugins { id 'com.android.application' }

android {
    namespace 'com.summithouse.werecooked'
    compileSdk 34
    defaultConfig {
        applicationId 'com.summithouse.werecooked'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '2.3'
    }
    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly. Swap in your own keystore before publishing to Play.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
