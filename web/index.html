<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4D38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="We're Cooked">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>We're Cooked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* VOICE  a family kitchen companion with a sense of humor: warm, confident, unfussy
   IDEA   a well-loved cookbook shelf on a cream kitchen counter; cast-iron green and flame orange from the logo
   TYPE   Fraunces (cookbook serif) for titles and recipe names, Inter for everything you tap
   LAYOUT phone first: slim header, scrolling page, bottom tab bar; centered column on wide screens */
:root{color-scheme:light dark;
 --bg:light-dark(#F6F1E7,#14120E);--paper:light-dark(#FFFDF8,#1D1A15);--sunk:light-dark(#EFE8DA,#25211B);
 --ink:light-dark(#1E1A16,#F3EEE4);--mute:light-dark(#6F665C,#ADA394);--line:light-dark(#E6DDCD,#302A22);
 --green:light-dark(#2E6B4E,#6DB38F);--greend:light-dark(#1F4D38,#8FCBAA);--greenbg:light-dark(#E3EEE7,#1C2A22);
 --flame:#FF6A1F;--flamed:light-dark(#D24F14,#FF8A4C);--flamebg:light-dark(#FFE9DC,#33200F);--yolk:#FFC531;
 --cook:#D9531A;--out:#2F6F9F;--takeout:#8B5BD6;--leftovers:#5E9E3A;--away:#8A817C;--other:#C9961B;
 --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 18px -8px rgba(60,40,20,.18);
 --serif:Fraunces,Georgia,'Times New Roman',serif;--sans:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);overflow-x:clip;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--flame);outline-offset:2px;border-radius:8px}
.app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto;background:var(--bg)}
/* header */
header.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
header.top img{width:38px;height:38px;flex:none}
.brand{flex:1;line-height:1.1}
.brand b{display:block;font:800 21px/1.05 var(--serif);letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--mute);font-weight:500}
main{flex:1;overflow-y:auto;padding:16px 16px 28px;scroll-behavior:smooth}
/* tabs */
nav.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--paper);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav.tabs button{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mute);min-height:54px;border-radius:14px;position:relative}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--greend)}
nav.tabs button[aria-current=page] .pill{background:var(--greenbg)}
.pill{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background .2s}
.cnt{position:absolute;top:2px;right:calc(50% - 26px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--flame);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
/* type */
h2{font:700 25px/1.15 var(--serif);margin:2px 0 4px;letter-spacing:-.01em}
.lede{color:var(--mute);margin:0 0 14px;font-size:14.5px}
h3{font:700 13px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 10px;color:var(--mute)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--mute)}
/* buttons */
.btn{border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:650;padding:11px 18px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.btn:active{transform:translateY(1px)}
.btn.flame{background:var(--flame)}
.btn.ghost{background:var(--sunk);color:var(--ink);box-shadow:none}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink);box-shadow:none}
.btn.sm{padding:7px 13px;min-height:38px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btn svg,.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{border:1px solid var(--line);background:var(--paper);border-radius:12px;min-width:44px;min-height:44px;font-weight:700;font-size:18px;display:grid;place-items:center}
/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.banner{display:flex;gap:12px;align-items:center;background:var(--greenbg);border:1px solid color-mix(in oklab,var(--green) 30%,transparent);border-radius:18px;padding:14px;margin-bottom:14px}
.banner.flame{background:var(--flamebg);border-color:color-mix(in oklab,var(--flame) 30%,transparent)}
.banner .em{font-size:28px;line-height:1}
.banner b{display:block;font-weight:700}
.banner p{margin:2px 0 0;font-size:13.5px;color:var(--mute)}
/* toolbar of big tiles */
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tool{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.tool .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--greenbg);color:var(--greend)}
.tool.f .ico{background:var(--flamebg);color:var(--flamed)}
/* week */
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.weekbar h2{margin:0;font-size:22px;text-align:center}
.day{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:stretch;width:100%;text-align:left;cursor:pointer;position:relative;overflow:hidden;padding:12px 14px 12px 12px}
.day::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--k,var(--line))}
.day.today{border-color:var(--green);box-shadow:0 0 0 1.5px var(--green),var(--shadow)}
.dd{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px dashed var(--line);padding-right:10px}
.dd b{font:800 26px/1 var(--serif)}
.dd span{font-size:11.5px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kind{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--k);background:color-mix(in oklab,var(--k) 14%,transparent);padding:3px 9px;border-radius:999px}
.kind i{width:7px;height:7px;border-radius:50%;background:var(--k);display:inline-block}
.dt{font:700 17px/1.25 var(--serif);margin:5px 0 2px}
.dt.none{font:500 15px/1.3 var(--sans);color:var(--mute)}
.dm{font-size:13px;color:var(--mute)}
.idea{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--flamed);font-weight:600;margin-top:4px}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:11.5px;font-weight:700;flex:none;border:2px solid var(--paper)}
.av.off{opacity:.3;filter:grayscale(1)}
.avs{display:flex;margin-left:auto}
.avs .av+.av{margin-left:-6px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stat b{display:block;font:700 20px/1.2 var(--serif)}
.stat span{font-size:12px;color:var(--mute)}
/* lists */
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.card>.item:first-child{padding-top:2px}
.iname{font-weight:600}
.imeta{font-size:13px;color:var(--mute)}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#FFF0C2;color:#6B4D00;white-space:nowrap;vertical-align:1px}
.badge.red{background:#FFE0D3;color:#9A2E06}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.stepper button{background:none;border:0;width:40px;height:40px;font-size:20px;font-weight:700;color:var(--green)}
.stepper span{min-width:54px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.chk{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk input{width:24px;height:24px;accent-color:var(--green)}
.chk.done .iname{text-decoration:line-through;color:var(--mute)}
.del{background:none;border:0;color:var(--mute);font-size:22px;width:40px;height:40px}
/* forms */
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],input[type=url],select,textarea{width:100%;font-size:16px;padding:11px 13px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);min-height:48px}
input:focus,select:focus,textarea:focus{border-color:var(--green);outline:none}
textarea{min-height:120px;resize:vertical}
label{display:block;font-size:13px;font-weight:650;color:var(--mute);margin:14px 0 6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 4px;font-weight:650;font-size:14px;min-height:44px}
.seg button[aria-pressed=true]{background:var(--k);border-color:var(--k);color:#fff}
.switch{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.switch button{border:0;background:none;border-radius:11px;padding:9px 6px;font-weight:650;font-size:14px;color:var(--mute)}
.switch button[aria-pressed=true]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 8px;margin:0 -18px 8px;padding-left:18px;padding-right:18px;scrollbar-width:none}.chips.scroll .chip{flex:none;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.search{position:relative;margin-bottom:14px}
.search input{padding-left:42px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2}
/* bookshelf */
.shelf{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity}
.book{flex:none;width:112px;height:150px;border-radius:6px 14px 14px 6px;border:0;color:#fff;text-align:left;padding:12px 10px 10px 16px;display:flex;flex-direction:column;justify-content:space-between;position:relative;background:var(--c);box-shadow:inset 6px 0 0 rgba(0,0,0,.18),inset 8px 0 0 rgba(255,255,255,.12),0 8px 18px -10px rgba(40,20,0,.55);scroll-snap-align:start}
.book .e{font-size:30px;line-height:1}
.book b{font:700 15px/1.15 var(--serif)}
.book small{font-size:11.5px;opacity:.85;font-weight:600}
.book[aria-pressed=true]{outline:3px solid var(--flame);outline-offset:3px}
.book.add{background:var(--paper);color:var(--mute);border:2px dashed var(--line);box-shadow:none;align-items:center;justify-content:center;text-align:center}
/* recipe cards */
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:620px){.rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.rcard .art{height:84px;background:radial-gradient(120% 90% at 85% 10%,rgba(255,255,255,.28),transparent 60%),var(--c);display:flex;align-items:flex-end;justify-content:space-between;padding:8px 10px;position:relative}
.rcard .art .e{font-size:38px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.rcard .art .fav{position:absolute;top:8px;right:10px;color:var(--yolk);font-size:16px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.rcard .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.rcard .t{font:700 15.5px/1.2 var(--serif);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .m{font-size:12px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.match{font-size:11.5px;font-weight:700;color:var(--leftovers);background:color-mix(in oklab,var(--leftovers) 14%,transparent);padding:2px 7px;border-radius:999px}
.todo{font-size:11px;font-weight:700;color:var(--flamed);background:var(--flamebg);padding:2px 7px;border-radius:999px}
.stars{color:var(--yolk);letter-spacing:1px;font-size:12px}
/* sheets */
.sheet{position:fixed;inset:0;background:rgba(20,12,4,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .18s ease}
.sheet>div{background:var(--bg);width:100%;max-width:760px;max-height:94%;overflow-y:auto;border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet>div::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet.full>div{max-height:100%;height:100%;border-radius:0;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.full>div::before{display:none}
.sheet h2{margin-top:0}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
/* recipe page */
.hero{background:radial-gradient(120% 100% at 90% 0%,rgba(255,255,255,.25),transparent 55%),var(--c);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 22px;position:relative}
.hero .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hero .bar button{background:rgba(0,0,0,.22);border:0;color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px;display:grid;place-items:center}
.hero .e{font-size:54px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.hero h1{font:800 28px/1.12 var(--serif);margin:10px 0 6px;letter-spacing:-.01em}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap}
.hero .meta span{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600}
.rbody{padding:16px 18px}
.rate{display:flex;gap:2px}
.rate button{background:none;border:0;font-size:26px;color:var(--line);padding:2px}
.rate button.on{color:var(--yolk)}
.ings{list-style:none;padding:0;margin:0}
.ings li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ings li:last-child{border-bottom:0}
.ings .box{width:22px;height:22px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;font-size:13px;color:#fff}
.ings li.got .box{background:var(--green);border-color:var(--green)}
.ings li.got .txt{text-decoration:line-through;color:var(--mute)}
.ings .home{font-size:11px;font-weight:700;color:var(--leftovers)}
.ings b{font-weight:700}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--greenbg);color:var(--greend);font:700 15px/30px var(--serif);text-align:center}
.steps li.done{color:var(--mute)}
.steps li.done::before{content:"✓";background:var(--green);color:#fff}
.cook .ings li,.cook .steps li{font-size:19px;line-height:1.5}
.note{background:var(--sunk);border-radius:14px;padding:12px 14px;font-size:14.5px}
.bchips{display:flex;gap:6px;flex-wrap:wrap}
.bchip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.bchip[aria-pressed=true]{border-color:var(--c);background:color-mix(in oklab,var(--c) 15%,var(--paper))}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:18px}
/* camera */
.cam{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:3/4;max-height:62vh;margin:0 auto}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .reticle{position:absolute;left:12%;right:12%;top:38%;height:24%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-weight:600;font-size:14px;text-shadow:0 1px 3px #000}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid var(--paper);background:var(--flame);box-shadow:0 0 0 2px var(--flame);margin:14px auto 0;display:block}
/* auth */
.auth{max-width:420px;margin:0 auto;padding:24px 6px}
.hero-logo{display:grid;place-items:center;padding:18px 0 4px}
.hero-logo img{width:132px;height:132px}
.auth h1{font:800 34px/1.05 var(--serif);text-align:center;margin:6px 0 6px}
.err{color:#B3380C;font-weight:600;font-size:14px;margin-top:8px}
.code{font:800 34px/1 var(--serif);letter-spacing:.14em;color:var(--greend)}
.empty{color:var(--mute);text-align:center;padding:28px 10px}
.empty .e{font-size:40px;display:block;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90%;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.toast.on{opacity:1}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:sp 0.8s linear infinite;margin:18px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.btn.google{width:100%;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);margin-top:16px}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin:18px 0 4px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
/* kitchen & pantry tiles */
.kwrap{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:var(--shadow);margin-bottom:6px}
.kitchen{display:block;width:100%;height:auto}
.kitchen .zone{cursor:pointer;transition:transform .15s,filter .15s;transform-box:fill-box;transform-origin:center}
.kitchen .zone:hover,.kitchen .zone:focus-visible{filter:brightness(1.06) drop-shadow(0 3px 6px rgba(60,30,0,.25));outline:none}
.kitchen .zone:active{transform:scale(.97)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:620px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ptile{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.ptile.low{border-color:color-mix(in oklab,var(--flame) 55%,var(--line))}
.pimg{border:0;height:104px;background:var(--sunk) center/cover no-repeat;position:relative;display:grid;place-items:center;padding:0}
.pimg .pe{font-size:44px}.pimg.has .pe{display:none}
.pimg .badge{position:absolute;top:8px;left:8px}
.pbody{padding:9px 10px 10px;display:flex;flex-direction:column;gap:4px}
.pbody .iname{font-size:14.5px;line-height:1.25}
.stepper.sm button{width:34px;height:34px;font-size:18px}.stepper.sm span{min-width:44px;font-size:13px}
.ptile .stepper{align-self:flex-start;margin-top:2px}
.thumb{flex:none;width:46px;height:46px;border-radius:12px;border:0;padding:0;background:var(--c,var(--sunk)) center/cover no-repeat;display:grid;place-items:center;font-size:24px}
.thumb.has>span{display:none}.thumb.big{width:58px;height:58px;font-size:30px;border-radius:14px}
.srow{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow.low .iname{color:var(--flamed)}
.pick{all:unset;box-sizing:border-box;display:grid;grid-template-columns:46px minmax(0,1fr) 34px;gap:12px;align-items:center;width:100%;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pick:last-child{border-bottom:0}
.pick .tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--mute)}
.pick.on .tick{background:var(--green);border-color:var(--green);color:#fff}
.rcard .art.has{background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.25)),var(--sunk) center/cover no-repeat}
.rcard .art.has .e{display:none}
.rcard .art{background-size:cover;background-position:center}
.hero.has{background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.1) 40%,rgba(0,0,0,.7) 100%),var(--img) center/cover no-repeat,var(--c);min-height:300px;display:flex;flex-direction:column;justify-content:space-between}
.hero.has h1{text-shadow:0 2px 8px rgba(0,0,0,.5)}
.leaflet-container{font:inherit}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
