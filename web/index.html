<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E4572E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="We're Cooked">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>We're Cooked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* VOICE everyday family tool: warm, quick, one-thumb use at the counter or in the aisle
   IDEA the fridge door: a week whiteboard, pantry shelf labels, a shared grocery pad
   PICTURE the week itself, seven day cards colored by plan type with who's cooking
   COLOUR white / warm charcoal night; tomato orange lead, butter yellow accent, plan colors for kinds
   TYPE Rubik for headings, Inter for everything else
   LAYOUT phone: header, scrolling screen, bottom tab bar. laptop: same column centered, max 720px */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#16110f);--ink:light-dark(#1f1714,#f5eeea);--mute:light-dark(#6d625d,#b3a6a0);--line:light-dark(#eee6e2,#2e2522);--soft:light-dark(#fbf5f2,#211a17);--card:light-dark(#ffffff,#1d1714);--tom:#E4572E;--tomd:light-dark(#c2401b,#ff7a52);--butter:#FFD166;--cook:#E4572E;--out:#2E86AB;--takeout:#9B5DE5;--leftovers:#76B041;--away:#8a817c;--other:#F2A541}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tom);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto}
header{background:var(--tom);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:800 26px/1 Rubik,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.hsub{font-size:13px;opacity:.9}
main{flex:1;overflow-y:auto;padding:14px 16px 24px}
nav.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mute);min-height:56px}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--tomd)}
h2{font:700 22px/1.15 Rubik,system-ui,sans-serif;margin:4px 0 12px}
h3{font:700 15px/1.2 Rubik,system-ui,sans-serif;margin:18px 0 8px;color:var(--mute)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.btn{border:0;border-radius:12px;background:var(--tom);color:#fff;font-weight:700;padding:11px 16px;min-height:44px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;min-height:38px;font-size:14px}
.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.day{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:stretch;width:100%;text-align:left;cursor:pointer;border-left:6px solid var(--k,var(--line))}
.day.today{box-shadow:0 0 0 2px var(--tom) inset}
.dd{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--line);padding-right:10px}
.dd b{font:800 24px/1 Rubik,sans-serif}
.dd span{font-size:12px;color:var(--mute);font-weight:600}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#fff;background:var(--k);padding:3px 9px;border-radius:999px}
.dt{font-weight:700;font-size:16px;margin:4px 0 2px}
.dm{font-size:13.5px;color:var(--mute)}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;flex:none}
.av.off{opacity:.25;filter:grayscale(1)}
.avs{display:flex;gap:4px;flex-wrap:wrap}
.cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--tom);color:#fff;font-size:11px}
.idea{font-size:13.5px;color:var(--tomd);font-weight:600}
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ib{border:1px solid var(--line);background:var(--bg);border-radius:12px;min-width:44px;min-height:44px;font-weight:700;font-size:18px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.iname{font-weight:600}
.imeta{font-size:13px;color:var(--mute)}
.badge{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--butter);color:#3a2a00;white-space:nowrap}
.badge.red{background:#ffd9cf;color:#8a2208}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step button{background:none;border:0;width:40px;height:40px;font-size:20px;font-weight:700;color:var(--tomd)}
.step span{min-width:52px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.chk{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.chk input{width:24px;height:24px;accent-color:var(--tom)}
.chk.done .iname{text-decoration:line-through;color:var(--mute)}
.del{background:none;border:0;color:var(--mute);font-size:22px;width:40px;height:40px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);min-height:46px}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:13.5px;font-weight:600;color:var(--mute);margin:12px 0 5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 4px;font-weight:700;font-size:14px;min-height:44px}
.seg button[aria-pressed=true]{background:var(--k);border-color:var(--k);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(20,10,5,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-top:0}
.recipe{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;cursor:pointer}
.match{font-size:12.5px;font-weight:700;color:var(--leftovers);white-space:nowrap}
.ings li{padding:6px 0;border-bottom:1px solid var(--line);list-style:none;display:flex;gap:10px}
.ings{padding:0;margin:0}
.ings .have{color:var(--leftovers);font-weight:700}
.ings .need{color:var(--tomd);font-weight:700}
ol.steps{padding-left:22px;margin:0}
ol.steps li{padding:5px 0}
.auth{max-width:420px;margin:0 auto;padding:24px 4px}
.hero{display:grid;place-items:center;padding:20px 0 8px}
.hero img{width:96px;height:96px;border-radius:24px}
.err{color:#c2401b;font-weight:600;font-size:14px;margin-top:8px}
.code{font:800 34px/1 Rubik,monospace;letter-spacing:.12em;color:var(--tomd)}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%}
.toast.on{opacity:1}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.legend .kind{font-size:11.5px}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
.btn.google{width:100%;background:#fff;color:#1f1f1f;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin:16px 0 4px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.leaflet-container{font:inherit}
</style>
<link rel="stylesheet" href="vendor/leaflet.css">
</head>
<body>
<div class="app" id="app"><main><p class="empty">Loading…</p></main></div>
<div class="toast" id="toast" role="status"></div>
<script src="vendor/supabase.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
